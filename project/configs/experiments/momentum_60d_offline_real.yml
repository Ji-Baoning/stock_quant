# 真实行情离线 ENGINEERING 复跑规格(非投资建议,非可信绩效声明)。
#
# 该规格在「离线重建数据集」版本上复跑 momentum_60d 2.0.0:数据集由当前已存
# 真实表(daily_bar 2021-01-04..2026-08-28 + 已复核 corporate_action)离线重建
# adjusted_bar 而来,未绑定任何 raw 拉取证据。
#
# dataset_version / universe_version 用 CURRENT 占位:运行期由 runner 读取
# CURRENT 指针一次、解析为显式版本后冻结(ExperimentSpec.freeze),冻结后的
# 规格只引用显式版本,永不保留 CURRENT。
#
# trust_mode: engineering —— 只描述本文件的离线诊断意图:`backtest
# --engineering` 的档位由命令行开关决定,不由本字段决定。`research run` 没有
# 降级开关,它必然以 RESEARCH 档运行并解析 CURRENT_ACCEPTED(本文件未写
# data_acceptance_id,取模型默认值即 CURRENT_ACCEPTED),因此经 `research run`
# 提交时冻结规格是 trust_mode: research 加具体验收 id,而不是这里声明的
# engineering(2026-09-13 实测:experiment_id eb1f944f…,报告窗口
# 2021-01-08..2026-08-24,真实数据验收 = ACCEPTED)。UNTRUSTED 工程诊断只走
# `backtest --engineering`,它落在 data/runs/debug、永不发布 ACCEPTED。
hypothesis: >-
  过去 60 个交易日的复权收益在 A 股样本内对随后短期收益存在一定持续性;
  本规格在真实行情(2021-01 至 2026-08)上复跑工程链路,验证离线重建数据
  集上 2.0.0 复权因子全流程可重现并产出报告。外部数据源故障期间仅作
  ENGINEERING 诊断,不声称统计有效性,也不构成投资建议或可信绩效声明。
factor_versions:
  momentum_60d: 2.0.0
dataset_version: CURRENT
universe_version: CURRENT
trust_mode: engineering
date_range:
  start_date: 2021-01-01
  end_date: 2026-08-21
train_validation_holdout_policy: not_applicable_engineering_mvp
preprocessing:
  winsorization: none
  standardization: none
portfolio_rule:
  name: top_n_equal_weight
  top_n: 10
  lot_size: 100
cost_scenarios:
  - zero_cost
  - commission_tax
  - full_cost
random_seed: 42
code_commit: unversioned
parent_experiment_ids: []
agent_id: null
