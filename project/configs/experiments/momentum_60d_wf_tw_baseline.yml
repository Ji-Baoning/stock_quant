# 真实行情 Walk-Forward ENGINEERING 基线规格（等权；非投资建议，非可信绩效声明）。
#
# 派生自 momentum_60d_wf_real_baseline.yml：原规格绑定的
# custom_csi300_ic_tradable（index_constitution 证据链）已无任何已发布数据集
# 携带其钉住的成员表哈希，无法再运行；本规格改绑现行冻结定义
# custom_csi300_tw_tradable（tushare index_weight 月度快照证据链，
# membership_table_sha256 5f5bf476…，与数据集 1709eddb… 的成员表逐位一致）。
# 除 universe_definition 外，组合规则/成本情景/日期范围/初始资金与原基线
# 规格完全一致；组合规则参数没有任何改动。
#
# 数据与信任语义与原基线规格一致：真实行情、工程信任模式、UNTRUSTED 诊断、
# 永不发布 ACCEPTED 实验或正式稳定性结论。
#
# execution_pipeline: walk_forward_oos_v1 —— 正式 Walk-Forward 管线在工程信任
# 模式下的诊断运行：请求范围 2020-01-01..2026-08-28 产生 2020..2025 六个完整
# 年度 fold（2026 年部分年度记录为 not_evaluated_boundary）；每个 fold 预热
# 至少三个整年且 ≥756 个确认交易日（2016 年起），独立账户、相同初始资金。
# 已知边界（2026-09-12 实测，本次运行前复核代码未变）：fold 预检无条件要求
# 绑定当前数据集的 ACCEPTED 验收审计（ACCEPTANCE_MISSING，engineering 无豁免
# 分支）。当前数据集 1709eddb… 尚无 ACCEPTED 验收记录时，本规格预期在 folds
# 预检阶段失败并留下完整审计——失败本身按约定作为阶段结果记录。
hypothesis: >-
  过去 60 个交易日的复权收益在 A 股样本内对随后短期收益存在一定持续性；
  等权 Top-10 基线用于与缓冲式风险加权挑战者在完全相同的真实行情
  Walk-Forward 输入上做工程级对比。外部数据源故障期间仅作 ENGINEERING
  诊断，不声称统计有效性，也不构成投资建议或可信绩效声明。
execution_pipeline: walk_forward_oos_v1
factor_versions:
  momentum_60d: 2.0.0
dataset_version: CURRENT
universe_version: CURRENT
universe_definition: custom_csi300_tw_tradable
trust_mode: engineering
# 工程诊断不绑定真实数据验收记录（缺省 CURRENT_ACCEPTED 会触发验收门禁）。
data_acceptance_id: null
date_range:
  start_date: 2020-01-01
  end_date: 2026-08-28
train_validation_holdout_policy: not_applicable_engineering_mvp
preprocessing:
  winsorization: none
  standardization: none
portfolio_rule:
  name: top_n_equal_weight
  top_n: 10
  lot_size: 100
cost_scenarios:
  - zero_cost
  - commission_tax
  - full_cost
random_seed: 42
code_commit: unversioned
parent_experiment_ids: []
agent_id: null
