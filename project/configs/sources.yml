tushare:
  enabled: true
  timeout_seconds: 30
  max_retries: 3
# The shared Tushare-compatible aggregation front (GET transport) inherits
# this segment's timeout_seconds/max_retries.  It is deliberately NOT its own
# source: `_CONFIGURED_SOURCES` (data_pipeline.py) is the closed registry the
# availability gate walks, and the proxy must not add a name to it.  When
# TUSHARE_PROXY_URL + TUSHARE_PROXY_KEY are set in the environment the tushare
# adapter routes through the proxy (windowed pages, transient retry); the
# official SDK stays the fallback.  Data source only - never an evidence
# source: universe/corporate-action evidence chains keep their official
# filings regardless of this switch.
akshare:
  enabled: true
  timeout_seconds: 30
  max_retries: 3
# baostock is the FORMer optional cross-check daily source (unadjusted
# prices).  Its data server (:10030) was unreachable from 2026-09-05,
# briefly answered on 2026-09-19, and is unavailable again as of 2026-09-26
# (owner report); it is disabled by default from that date.  xingyao holds
# both of the roles it really had -- the validation daily lane and the
# ADR-009 factor channel (ADR-016) -- so disabling it removes no capability
# that is not carried elsewhere.  Two claims that used to sit here were
# never true and are recorded as such: an outage never degraded
# `compare_daily_sources` (its only production consumer reads a published
# `daily_bar` sample), and the supplier's own suspension rows
# (`tradestatus=0`) were never read as suspension evidence -- `tradestatus`
# appears once in `src/`, as a field declaration, and the project's
# suspension facts come from tushare's `pre_close` chain.  Re-enabling the
# source is a config change; re-admitting it to raw-snapshot reuse is not
# (ADR-015 decision 1, as amended by ADR-016).
baostock:
  enabled: false
  timeout_seconds: 30
  max_retries: 3
# 星耀数智 (tgw broker SDK): the optional validation daily source that
# replaces baostock, and the ADR-009 factor channel's second price-event
# channel.  Optional by role (`_REQUIRED_ROLE`): an outage degrades the
# missing-row classification and the factor channel, never a publication.
# Needs the supplier's private wheel (tgw / AmazingData) and credentials in
# AD_USERNAME/AD_PASSWORD/AD_HOST/AD_PORT; absent either, the source reports
# `optional_source_unavailable` and the update proceeds.  Every live call runs
# in a killable child process (`timeout_seconds` bounds the process, not the
# socket).  Volume/amount units are measured shares/yuan -- (1, 1) (Phase 0
# probe 6, docs/operations/2026-09-26-xingyao-phase0-probes.md §七).
# Shipped ENABLED (owner ruling 2026-09-27): the batch channel the 09-26
# ruling waited for is measured and frozen (see the segment comment below),
# so the per-symbol quota bound no longer holds -- the daily lane dispatches
# in frozen batches.  Disabling again is a config change; the record lives in
# the owner's ADR edit.
xingyao:
  # 批量通道（ADR-020）：daily 对已按实测冻结（2026-09-27 探针，见
  # docs/operations/2026-09-27-batched-channel-probes.md：329-code 片实测
  # 可接受，整片墙钟最大 6.5s）。成对配置：只给 size 或只给 timeout 会被
  # SourceConfig 拒绝；两者都不给 = 该端点仍走逐标的请求。factor 对未冻结：
  # 因子端点多 code 返回宽表而非 mapping，批量分片假设不成立（同上 ops
  # 记录 §六-1，待 owner 裁定），保持注释 = 因子通道继续逐标的。
  batch_size: 329
  batch_timeout_seconds: 20
  # factor_batch_size: 200
  # factor_batch_timeout_seconds: 300
  enabled: true
  timeout_seconds: 30
  max_retries: 2
# TDX (通达信) is the corporate-action *conflict arbiter* of ADR-007 - not a
# source.  It adds no name to `_CONFIGURED_SOURCES`, is never added to
# `CORPORATE_ACTION_ENDPOINTS`, and never supplies a booked row: it is asked
# only where CNINFO and Eastmoney disagree on the same (symbol, ex_date), to
# name which official filing to adopt.
#
# Shipped ON (owner decision 2026-09-20).  Arbitration changes published
# corporate-action facts, so any change to this default is an owner act; the
# channel itself is consulted lazily - only a symbol with an actual
# cross-source disagreement costs a TDX call, and a clean round makes none.
# Each round must keep the xdxr responses as raw snapshots (written under
# raw/tdx/tdx_xdxr/**) so the arbitration is reproducible from stored bytes.
# It needs the optional pytdxdata package (pip install pytdxdata;
# Requires-Python >= 3.11); absent or unreachable, that symbol's conflicts
# stay quarantined and the update records a WARNING.  No retry policy is
# applied here - one failed xdxr read leaves that conflict set unarbitrated,
# which is the fail-closed direction.
tdx:
  enabled: true
  timeout_seconds: 30
# ---- Table-level data contracts (spec D2 / ADR-010) ----------------------- #
# One declaration per published table.  The data_update publish path rejects
# any published table without a declaration (unregistered_table FATAL).
# tier: core / anchored / research_only (D1).  Tier changes happen ONLY via
# this file + an ADR, never in code.
# primary_transport: "<source>:<kind>" where kind is a transport token
# (relay / official / proxy) - a transport reference, not a source name.
# incremental: the per-table fetch-window strategy (D5/A3).
data_contracts:
  - table: daily_bar
    tier: core
    primary_transport: tushare:relay
    anchors: []
    conflict: downgrade
    pit: null
    coverage_shape: none
    incremental: last_covered_plus_1
  - table: adjusted_bar
    tier: core
    # Derived each update from daily_bar + corporate_action, full rebuild.
    primary_transport: tushare:relay
    anchors: []
    conflict: block
    pit: null
    coverage_shape: none
    incremental: change_driven_full
  - table: security_master
    tier: core
    primary_transport: tushare:relay
    anchors: []
    conflict: block
    pit: null
    coverage_shape: none
    incremental: last_covered_plus_1
  - table: security_master_coverage
    tier: core
    primary_transport: tushare:relay
    anchors: []
    conflict: block
    pit: null
    coverage_shape: none
    incremental: last_covered_plus_1
  - table: corporate_action
    tier: core
    primary_transport: akshare:official
    anchors: []
    conflict: arbitrate
    pit: null
    coverage_shape: per_symbol_window
    incremental: disclosure_calendar
  - table: corporate_action_quarantine
    tier: core
    primary_transport: akshare:official
    anchors: []
    conflict: block
    pit: null
    coverage_shape: none
    incremental: disclosure_calendar
  - table: corporate_action_coverage
    tier: core
    primary_transport: akshare:official
    anchors: []
    conflict: block
    pit: null
    coverage_shape: none
    incremental: disclosure_calendar
  - table: trading_calendar
    tier: core
    primary_transport: tushare:relay
    anchors: []
    conflict: block
    pit: null
    coverage_shape: none
    incremental: last_covered_plus_1
  - table: universe_membership
    tier: core
    # Imported offline from sealed CSI snapshots; carried verbatim by updates.
    primary_transport: csi:official
    anchors: []
    conflict: block
    pit: null
    coverage_shape: none
    incremental: change_driven_full
