tushare:
  enabled: true
  timeout_seconds: 30
  max_retries: 3
# The shared Tushare-compatible aggregation front (GET transport) inherits
# this segment's timeout_seconds/max_retries.  It is deliberately NOT its own
# source: `_CONFIGURED_SOURCES` (data_pipeline.py) is the closed registry the
# availability gate walks, and the proxy must not add a name to it.  When
# TUSHARE_PROXY_URL + TUSHARE_PROXY_KEY are set in the environment the tushare
# adapter routes through the proxy (windowed pages, transient retry); the
# official SDK stays the fallback.  Data source only - never an evidence
# source: universe/corporate-action evidence chains keep their official
# filings regardless of this switch.
akshare:
  enabled: true
  timeout_seconds: 30
  max_retries: 3
# baostock data server (:10030) down since 2026-09-05; optional cross-check only.
# Re-enable once reachable.
baostock:
  enabled: false
  timeout_seconds: 30
  max_retries: 3
# TDX (通达信) is the corporate-action *conflict arbiter* of ADR-007 - not a
# source.  It adds no name to `_CONFIGURED_SOURCES`, is never added to
# `CORPORATE_ACTION_ENDPOINTS`, and never supplies a booked row: it is asked
# only where CNINFO and Eastmoney disagree on the same (symbol, ex_date), to
# name which official filing to adopt.
#
# Default off.  Enabling it changes published corporate-action facts and so
# requires a rebuild, and that rebuild must keep the xdxr responses as raw
# snapshots (written under raw/tdx/tdx_xdxr/**) so the arbitration is
# reproducible from stored bytes.  It needs the optional pytdxdata package
# (pip install pytdxdata; no runtime dependencies, but Requires-Python >= 3.11
# -- one minor above this project's >=3.10 floor, so a 3.10 interpreter cannot
# install it from PyPI); absent or unreachable, every conflict stays quarantined
# and the update records a WARNING.  No retry policy is applied here - one
# failed xdxr read leaves the whole conflict set unarbitrated, which is the
# fail-closed direction.
tdx:
  enabled: false
  timeout_seconds: 30
