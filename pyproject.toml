[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-quant"
version = "0.1.0"
description = "Reproducible engineering MVP for A-share quantitative research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Jinja2>=3",
    "numpy>=1.22",
    "pandas>=3",
    "pydantic>=2",
    "plotly>=5",
    "pyarrow>=14",
    "PyYAML>=6",
    "typer>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = '-m "not external and not smoke"'
markers = [
    "external: marks tests requiring external services",
    "smoke: marks real small-scope smoke tests",
]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
