tushare:
  enabled: true
  timeout_seconds: 30
  max_retries: 3
akshare:
  enabled: true
  timeout_seconds: 30
  max_retries: 3
baostock:
  # Former optional cross-check daily source (unadjusted prices); its data
  # server has been unavailable since 2026-09-26 (owner report) and xingyao
  # holds both of the roles it really had (ADR-016).  See
  # project/configs/sources.yml for the full history and the re-enable /
  # re-admission distinction.
  enabled: false
  timeout_seconds: 30
  max_retries: 3
xingyao:
  # The validation daily source and the ADR-009 factor channel (ADR-016);
  # ships disabled pending a batch fetch channel (the per-symbol lane costs
  # one login session per symbol per round).  See
  # project/configs/sources.yml.
  # 批量通道（ADR-020）：daily 对已按实测冻结（2026-09-27 探针，见
  # docs/operations/2026-09-27-batched-channel-probes.md：329-code 片实测
  # 可接受，整片墙钟最大 6.5s）。成对配置：只给 size 或只给 timeout 会被
  # SourceConfig 拒绝；两者都不给 = 该端点仍走逐标的请求。factor 对未冻结：
  # 因子端点多 code 返回宽表而非 mapping，批量分片假设不成立（同上 ops
  # 记录 §六-1，待 owner 裁定），保持注释 = 因子通道继续逐标的。
  batch_size: 329
  batch_timeout_seconds: 20
  # factor_batch_size: 200
  # factor_batch_timeout_seconds: 300
  enabled: false
  timeout_seconds: 30
  max_retries: 2
# Corporate-action conflict arbiter, not a source (ADR-007).  Shipped on
# (owner decision 2026-09-20): it is consulted lazily, only where the two
# official sources disagree, and a clean round makes no TDX call; absent
# pytdxdata or an unreachable channel leaves conflicts quarantined with a
# WARNING.  See project/configs/sources.yml.
tdx:
  enabled: true
  timeout_seconds: 30
# ---- Table-level data contracts (spec D2 / ADR-010) ----------------------- #
# One declaration per published table.  The data_update publish path rejects
# any published table without a declaration (unregistered_table FATAL).
# tier: core / anchored / research_only (D1).  Tier changes happen ONLY via
# this file + an ADR, never in code.
# primary_transport: "<source>:<kind>" where kind is a transport token
# (relay / official / proxy) - a transport reference, not a source name.
# incremental: the per-table fetch-window strategy (D5/A3).
data_contracts:
  - table: daily_bar
    tier: core
    primary_transport: tushare:relay
    anchors: []
    conflict: downgrade
    pit: null
    coverage_shape: none
    incremental: last_covered_plus_1
  - table: adjusted_bar
    tier: core
    # Derived each update from daily_bar + corporate_action, full rebuild.
    primary_transport: tushare:relay
    anchors: []
    conflict: block
    pit: null
    coverage_shape: none
    incremental: change_driven_full
  - table: security_master
    tier: core
    primary_transport: tushare:relay
    anchors: []
    conflict: block
    pit: null
    coverage_shape: none
    incremental: last_covered_plus_1
  - table: security_master_coverage
    tier: core
    primary_transport: tushare:relay
    anchors: []
    conflict: block
    pit: null
    coverage_shape: none
    incremental: last_covered_plus_1
  - table: corporate_action
    tier: core
    primary_transport: akshare:official
    anchors: []
    conflict: arbitrate
    pit: null
    coverage_shape: per_symbol_window
    incremental: disclosure_calendar
  - table: corporate_action_quarantine
    tier: core
    primary_transport: akshare:official
    anchors: []
    conflict: block
    pit: null
    coverage_shape: none
    incremental: disclosure_calendar
  - table: corporate_action_coverage
    tier: core
    primary_transport: akshare:official
    anchors: []
    conflict: block
    pit: null
    coverage_shape: none
    incremental: disclosure_calendar
  - table: trading_calendar
    tier: core
    primary_transport: tushare:relay
    anchors: []
    conflict: block
    pit: null
    coverage_shape: none
    incremental: last_covered_plus_1
  - table: universe_membership
    tier: core
    # Imported offline from sealed CSI snapshots; carried verbatim by updates.
    primary_transport: csi:official
    anchors: []
    conflict: block
    pit: null
    coverage_shape: none
    incremental: change_driven_full
